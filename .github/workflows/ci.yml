name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm i18n:check
      # Fails when the Drizzle schema changed without a generated migration.
      - run: pnpm db:check
      - run: pnpm turbo run lint typecheck test build

  # Builds the image and runs the documented self-host path end to end:
  # compose up (migrations, then app), a backup, and a restore of it.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "APP_SECRET=$(openssl rand -hex 32)"
            echo "APP_URL=http://localhost:3000"
            echo "EMAIL_TRANSPORT=console"
          } >> .env
      - run: docker compose up -d --build --wait
      - name: Smoke test
        run: |
          curl -fsS localhost:3000/api/health
          curl -fsS -H 'Accept-Language: tr' localhost:3000/ | grep -q 'lang="tr"'
      - name: Backup and restore
        run: |
          docker compose exec -T postgres psql -U zaydemy -d zaydemy -c \
            "insert into organization (name, slug) values ('CI Academy', 'ci-academy')"
          docker/backup.sh ./backups
          docker compose down -v
          docker compose up -d --wait
          docker/restore.sh ./backups/*.dump --yes
          test "$(docker compose exec -T postgres psql -U zaydemy -d zaydemy -Atc \
            "select name from organization")" = "CI Academy"
          curl -fsS localhost:3000/api/health
      - if: failure()
        run: docker compose logs
